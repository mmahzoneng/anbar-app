name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # پایدارتر از ubuntu-latest برای flet

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system flet
          uv pip install --system -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --verbose --release

      - name: List built files (for debugging)
        run: ls -la build/ build/apk/ || echo "Build folder not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anbar-App-APK
          path: |
            build/*.apk
            build/apk/*.apk
          if-no-files-found: warn
